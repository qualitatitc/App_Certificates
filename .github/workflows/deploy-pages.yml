# =============================================================================
# PUBLICACIÓN CORRECTA PARA GITHUB PAGES (Vite + React)
# =============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Comprobar que se publicó el build (no el index.html de desarrollo)
        run: |
          test -f dist/index.html
          node -e "const fs=require('fs');const n=fs.statSync('dist/index.html').size;if(n<50000)throw new Error('dist/index.html es demasiado pequeño ('+n+' bytes). Falta npm run build o se subió la carpeta equivocada.')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
